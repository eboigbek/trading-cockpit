name: Cockpit veröffentlichen

on:
  push:
    branches: [main]
    paths: ["trading-cockpit/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite vorbereiten
        run: |
          mkdir _site
          cp -r trading-cockpit/docs/. _site/
          sed -i 's#/main/data/cockpit.json#/main/trading-cockpit/data/cockpit.json#' _site/index.html
          grep -c "trading-cockpit/data/cockpit.json" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
