name: Steuerung

# Knopf in GitHub (auch in der GitHub-App): Actions -> Steuerung -> Run workflow
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        required: true
        type: choice
        options:
          - "Not-Aus (alles schließen, nicht mehr handeln)"
          - "Weiter handeln (Not-Aus aufheben)"
          - "Echtgeld anfordern (nur wirksam, wenn freigeschaltet)"
          - "Zurück auf Spielgeld"
          - "Spielgeld-Konto zurücksetzen (alles löschen, neu starten)"

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -q -r trading-cockpit/requirements.txt
      - name: Daten laden
        run: bash trading-cockpit/load_data.sh
      - name: Aktion ausführen und Bot einmal laufen lassen
        working-directory: trading-cockpit
        env:
          AKTION: ${{ inputs.aktion }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COCKPIT_PASSWORT: ${{ secrets.COCKPIT_PASSWORT }}
        run: |
          python control_action.py "$AKTION"
          python run.py live --once
      - name: Steuerdatei in main speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-cockpit/control.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Steuerung: ${{ inputs.aktion }}"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
      - name: Daten speichern
        run: bash trading-cockpit/save_data.sh "Steuerung"
