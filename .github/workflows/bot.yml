name: Trading-Bot

# Startet alle 5 Minuten (GitHub verschiebt oder überspringt geplante Läufe manchmal; der Bot holt
# verpasste Kerzen nach). Daten liegen im Zweig "data", nicht in main.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-cockpit/requirements.txt
      - name: Abhängigkeiten
        run: pip install -q -r trading-cockpit/requirements.txt
      - name: Daten laden
        run: bash trading-cockpit/load_data.sh
      - name: Bot-Durchlauf
        working-directory: trading-cockpit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COCKPIT_PASSWORT: ${{ secrets.COCKPIT_PASSWORT }}
        run: python run.py live --once
      - name: Daten speichern
        run: bash trading-cockpit/save_data.sh "Bot-Lauf"
