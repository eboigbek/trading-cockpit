name: Trading-Bot

# Läuft alle 15 Minuten, kurz nach jedem Kerzenschluss (:02, :17, :32, :47).
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

defaults:
  run:
    working-directory: trading-cockpit

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-cockpit/requirements.txt
      - name: Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Bot-Durchlauf
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COCKPIT_PASSWORT: ${{ secrets.COCKPIT_PASSWORT }}
        run: python run.py live --once
      - name: Ergebnis speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -q -m "Bot-Lauf $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep 5
          done
          echo "Push fehlgeschlagen" && exit 1
